modLoader = "javafml"
loaderVersion = "*"
license = "${license}"
issueTrackerURL = "${issues}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
logoFile = "assets/fundamentals/icon.png"
authors = "${author}"
description = '''
${description}
'''

[[mixins]]
config = "${id}.mixins.json"

[[mixins]]
config = "${id}.createnuclear.mixins.json"

[[mixins]]
config = "${id}.computercraft.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mcdep}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "create"
type = "required"
versionRange = "[${create_min},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${id}]]
modId = "tfmg"
type = "required"
versionRange = "[${tfmg_min},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${id}]]
modId = "fundamentalmagic"
type = "required"
versionRange = "[${principles_min},1.0)"
ordering = "AFTER"
side = "BOTH"

# Optional. Loading after it is what lets data/chemica/ replace its recipes; see tools/build_chemica_compat.py.
[[dependencies.${id}]]
modId = "chemica"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Optional, the same way: data/createnuclear/ replaces its recipes; see tools/build_create_nuclear_compat.py.
[[dependencies.${id}]]
modId = "createnuclear"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Optional: with it, computers read our gauges, cells and settlers; see computer/FundamentalsPeripherals.
[[dependencies.${id}]]
modId = "computercraft"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
