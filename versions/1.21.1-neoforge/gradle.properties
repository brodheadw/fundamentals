# Create (required). Modrinth version id of create 6.0.10 for NeoForge 1.21.1.
deps.create_version=UjX6dr61
deps.create_min=6.0.0
# Create: The Factory Must Grow (required). Modrinth version id of 1.2.0.
deps.tfmg_version=uDi14nbt
deps.tfmg_min=1.2.0
# Fundamentals: Principles (required, bundled in the jar): the temperature at every block lives there.
deps.principles_version=0.4.0
deps.principles_min=0.4.0
