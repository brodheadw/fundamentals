# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod identity
mod.name=Fundamentals
mod.id=fundamentals
mod.version=0.1.0
mod.group=ai.gsmc.fundamentals
mod.description=A chemistry-driven materials and processing framework for Minecraft.
mod.author=GSMC
mod.license=MIT
mod.source=https://github.com/brodheadw/fundamentals
mod.issues=https://github.com/brodheadw/fundamentals/issues

# Shared dependency versions (loader-specific ones live in versions/*/gradle.properties)
deps.fabric_loader_version=0.16.14

# Values marked [VERSIONED] are supplied per target in versions/<mc>-<loader>/gradle.properties
mod.mc_version=[VERSIONED]
mod.mc_dep=[VERSIONED]
deps.parchment_version=[VERSIONED]
deps.fabric_api_version=[VERSIONED]
deps.neoforge_version=[VERSIONED]
